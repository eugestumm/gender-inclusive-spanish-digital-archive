<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pajubá — Documentação ao Longo do Tempo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        :root {
            --bg: #0f0e0c;
            --text: #f0ead8;
            --muted: #5a5248;
            --muted2: #7a7060;
            --gold: #c8a96e;
            --blue: #6e8fa8;
            --border: #2a2620;
            --focus: #f0ead8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* ── Skip link for keyboard users ── */
        .skip-link {
            position: fixed; top: -100%; left: 16px; z-index: 9999;
            padding: 8px 16px; background: var(--gold); color: #0f0e0c;
            font-size: 12px; border-radius: 2px; font-weight: 600;
            transition: top 0.15s;
        }
        .skip-link:focus { top: 16px; }

        /* ── Header ── */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            padding: 24px 52px 16px;
            display: flex; justify-content: space-between; align-items: flex-end;
            background: linear-gradient(to bottom, rgba(15,14,12,1) 65%, rgba(15,14,12,0));
            pointer-events: none;
        }
        .header > * { pointer-events: all; }

        .eyebrow { font-size: 9px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.3rem, 2vw, 2rem); font-weight: 400; line-height: 1.15; letter-spacing: -0.02em; }
        h1 em { font-style: italic; color: var(--gold); }

        .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .ctrl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

        .filter-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 11px;
            border: 1px solid var(--border);
            background: rgba(15,14,12,0.85);
            font-family: 'DM Mono', monospace;
            font-size: 10px; letter-spacing: 0.07em;
            cursor: pointer; border-radius: 2px; transition: border-color 0.15s, color 0.15s;
            color: var(--muted2);
        }
        .filter-btn:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }
        .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .filter-btn.on-gold { border-color: rgba(200,169,110,0.5); color: var(--gold); }
        .filter-btn.on-blue { border-color: rgba(110,143,168,0.5); color: var(--blue); }

        .range-wrap { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--muted2); }
        input[type=range] {
            -webkit-appearance: none; width: 84px; height: 2px;
            background: var(--muted); outline: none; border-radius: 1px; cursor: pointer;
        }
        input[type=range]:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); cursor: pointer; }
        input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); cursor: pointer; border: none; }
        #range-lbl { color: var(--text); min-width: 72px; font-size: 10px; text-align: center; }

        .zoom-row { display: flex; align-items: center; gap: 5px; }
        .zbtn {
            background: rgba(15,14,12,0.85); border: 1px solid var(--border);
            color: var(--muted2); font-family: 'DM Mono', monospace;
            font-size: 13px; width: 26px; height: 26px; line-height: 1;
            cursor: pointer; border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s, color 0.15s;
        }
        .zbtn:hover { border-color: var(--gold); color: var(--gold); }
        .zbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        #zoom-lbl { font-size: 10px; color: var(--muted2); min-width: 34px; text-align: center; }
        .stats { font-size: 10px; color: var(--muted2); }
        .stats strong { color: var(--text); }

        /* ── Stage ── */
        #stage {
            position: fixed; inset: 0;
            overflow: hidden;
            cursor: grab;
        }
        #stage:active { cursor: grabbing; }
        #stage:focus { outline: none; }
        #stage:focus-visible { outline: 2px solid var(--focus); }

        #svg-wrap {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        /* ── Fixed decade ruler at bottom of viewport ── */
        #decade-ruler {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 52px;
            background: linear-gradient(to top, rgba(15,14,12,1) 60%, rgba(15,14,12,0));
            pointer-events: none;
            z-index: 150;
            overflow: hidden;
        }
        #decade-ruler svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; overflow: visible; }

        /* ── Tooltip ── */
        #tt {
            position: fixed; padding: 12px 16px;
            background: #1c1a16; border: 1px solid #333028;
            border-radius: 3px; font-family: 'DM Mono', monospace;
            font-size: 11px; color: var(--text);
            pointer-events: none; opacity: 0; transition: opacity 0.1s;
            z-index: 500; box-shadow: 0 16px 40px rgba(0,0,0,0.8);
            max-width: 230px;
        }
        #tt.show { opacity: 1; }
        .tt-word { font-family: 'Playfair Display', serif; font-size: 16px; font-style: italic; color: var(--gold); margin-bottom: 8px; word-break: break-word; }
        .tt-row { display: flex; justify-content: space-between; gap: 20px; font-size: 10px; color: var(--muted2); line-height: 1.9; }
        .tt-row span:last-child { color: var(--text); }

        /* ── Loading ── */
        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; color: var(--muted2); font-size: 11px;
            background: var(--bg); z-index: 400;
        }
        .spinner { width: 20px; height: 20px; border: 1px solid var(--muted); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── SVG bubble styles ── */
        .bubble-lbl {
            font-family: 'DM Mono', monospace;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            font-size: 8.5px;
        }

        /* Screen-reader only utility */
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body>

<a href="#main-viz" class="skip-link">Ir para a visualização</a>

<div id="loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <span>Carregando léxico…</span>
</div>

<header class="header" role="banner">
    <div>
        <h1>Pajubá —<br><em>Documentação ao Longo do Tempo</em></h1>
    </div>
    <div class="controls" role="group" aria-label="Filtros da visualização">
        <div class="ctrl-row">
            <button class="filter-btn on-gold" id="btn-yes"
                aria-pressed="true" aria-label="Mostrar palavras presentes na mídia de massa">
                <span class="dot" style="background:var(--gold)" aria-hidden="true"></span>
                <span>Presente na Mídia</span>
            </button>
            <button class="filter-btn on-blue" id="btn-no"
                aria-pressed="true" aria-label="Mostrar palavras ausentes na mídia de massa">
                <span class="dot" style="background:var(--blue)" aria-hidden="true"></span>
                <span>Ausente na Mídia</span>
            </button>
            <div class="stats" id="stats" aria-live="polite" aria-atomic="true">— palavras</div>
        </div>
        <div class="ctrl-row">
            <div class="range-wrap" role="group" aria-label="Filtro por intervalo de anos">
                <label for="yr-start" class="sr-only">Ano inicial</label>
                <input type="range" id="yr-start" aria-valuetext="ano inicial">
                <span id="range-lbl" aria-live="polite">– –</span>
                <label for="yr-end" class="sr-only">Ano final</label>
                <input type="range" id="yr-end" aria-valuetext="ano final">
            </div>
            <div class="zoom-row" role="group" aria-label="Controles de zoom">
                <button class="zbtn" id="z-out" aria-label="Diminuir zoom">−</button>
                <span id="zoom-lbl" aria-live="polite" aria-atomic="true">100%</span>
                <button class="zbtn" id="z-in" aria-label="Aumentar zoom">+</button>
                <button class="zbtn" id="z-fit" aria-label="Ajustar à tela" style="width:auto;padding:0 7px;font-size:9px;letter-spacing:0.05em;">FIT</button>
            </div>
        </div>
    </div>
</header>

<!-- O canvas navegável -->
<main id="stage" role="main" aria-label="Visualização de bolhas do Pajubá. Use os controles de zoom ou o scroll para aproximar, e arraste para navegar."
     tabindex="0" id="main-viz">
    <div id="svg-wrap">
        <svg id="svg" role="img" aria-label="Gráfico de bolhas com palavras do Pajubá organizadas por ano de documentação"></svg>
    </div>
</main>

<!-- Fixed decade ruler — always visible at bottom -->
<div id="decade-ruler" role="presentation" aria-hidden="true">
    <svg id="ruler-svg"></svg>
</div>

<div id="tt" role="tooltip" aria-live="polite"></div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSD2ABiXhZM4n3uf2hVTua0ZV2hK-VijPDU0lRBCZmBKlj8HHZpDhYK-y_0hm3tysuaVPNU5_CCLKXj/pub?output=csv';
const COLORS = { yes: '#c8a96e', no: '#6e8fa8' };
const FONT_SIZE = 9;
const CHAR_W = FONT_SIZE * 0.62;
const R_PAD = 8;
function wordRadius(word) {
    return Math.max(18, Math.ceil((word.length * CHAR_W) / 2) + R_PAD);
}
const PAD_X = 80;
const PAD_Y = 70;
const PX_PER_WORD = 46;
const MIN_DEC_W = 90;
const MAX_DEC_W = 700;

let allData = [];
let show = { yes: true, no: true };
let yearRange = [0, 9999];
let activeWord = null; // kept for keyboard Escape compat

// Frozen simulation output — only recomputed when data/filters change, never on pan/zoom
let frozenNodes = null;
let frozenLayout = null; // { svgW, svgH, offX, offY, xScale, dec0, decN, yMin, yMax, xMin, xMax }

// ── Pan/zoom state ────────────────────────────────────────────────────────────
let tx = 0, ty = 80, scale = 1;

function applyTransform(animate) {
    const wrap = document.getElementById('svg-wrap');
    wrap.style.transition = animate ? 'transform 0.25s ease' : 'none';
    wrap.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    document.getElementById('zoom-lbl').textContent = Math.round(scale * 100) + '%';
    updateRuler();
}

function clampScale(s) { return Math.max(0.06, Math.min(5, s)); }

function zoomAt(cx, cy, factor, animate) {
    const ns = clampScale(scale * factor);
    const f  = ns / scale;
    tx = cx - f * (cx - tx);
    ty = cy - f * (cy - ty);
    scale = ns;
    applyTransform(animate);
}

function fitToScreen() {
    if (!frozenLayout) return;
    const { svgW, svgH } = frozenLayout;
    const vw = window.innerWidth, vh = window.innerHeight;
    const HEADER_H = 110;
    const RULER_H  = 52;
    const available_h = vh - HEADER_H - RULER_H;
    scale = clampScale(Math.min(vw / svgW, available_h / svgH) * 0.9);
    tx = (vw - svgW * scale) / 2;
    ty = HEADER_H + (available_h - svgH * scale) / 2;
    applyTransform(true);
}

// ── Decade ruler (fixed at bottom, updates on pan/zoom) ───────────────────────
function updateRuler() {
    if (!frozenLayout) return;
    const { xScale, dec0, decN, offX } = frozenLayout;
    const vw = window.innerWidth;
    const rulerSvg = d3.select('#ruler-svg');
    rulerSvg.selectAll('*').remove();

    const RULER_H = 52;

    for (let dec = dec0; dec <= decN; dec += 10) {
        // Convert SVG coordinate to screen coordinate
        const svgX = xScale(dec) + offX;
        const screenX = svgX * scale + tx;

        // Only draw if on screen
        if (screenX < -60 || screenX > vw + 60) continue;

        // Tick mark
        rulerSvg.append('line')
            .attr('x1', screenX).attr('x2', screenX)
            .attr('y1', 4).attr('y2', 14)
            .attr('stroke', '#3a3630')
            .attr('stroke-width', 1);

        // Year label — large enough to always read
        rulerSvg.append('text')
            .attr('x', screenX)
            .attr('y', RULER_H - 10)
            .attr('text-anchor', 'middle')
            .attr('font-family', 'Playfair Display, serif')
            .attr('font-style', 'italic')
            .attr('font-size', 18)
            .attr('fill', '#b0a898')
            .attr('font-weight', '400')
            .text(dec);
    }

    // Horizontal baseline
    rulerSvg.append('line')
        .attr('x1', 0).attr('x2', vw)
        .attr('y1', 2).attr('y2', 2)
        .attr('stroke', '#222018')
        .attr('stroke-width', 1);
}

// ── Pan (no render call!) ─────────────────────────────────────────────────────
let panning = false, px0, py0, tx0, ty0;
const stage = document.getElementById('stage');

stage.addEventListener('mousedown', e => {
    if (e.target.closest('[data-bubble]')) return;
    panning = true; px0 = e.clientX; py0 = e.clientY; tx0 = tx; ty0 = ty;
    stage.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', () => { panning = false; stage.style.cursor = 'grab'; });
window.addEventListener('mousemove', e => {
    if (!panning) return;
    tx = tx0 + (e.clientX - px0);
    ty = ty0 + (e.clientY - py0);
    applyTransform(false); // just moves the wrapper, never redraws SVG
});

stage.addEventListener('wheel', e => {
    e.preventDefault();
    // Normalize delta so trackpads and mouse wheels feel the same speed
    const delta = Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 60);
    const factor = Math.pow(1.001, -delta); // smooth: ~1.06 max per scroll tick
    zoomAt(e.clientX, e.clientY, factor, false);
}, { passive: false });

// Pinch
let lastPinch = null;
stage.addEventListener('touchstart', e => {
    if (e.touches.length === 2)
        lastPinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
}, { passive: true });
stage.addEventListener('touchmove', e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    const cx = (e.touches[0].clientX+e.touches[1].clientX)/2;
    const cy = (e.touches[0].clientY+e.touches[1].clientY)/2;
    if (lastPinch) zoomAt(cx, cy, d/lastPinch, false);
    lastPinch = d;
}, { passive: false });

// Keyboard pan/zoom on stage
stage.addEventListener('keydown', e => {
    const PAN = 60;
    switch (e.key) {
        case 'ArrowLeft':  tx += PAN; applyTransform(true); e.preventDefault(); break;
        case 'ArrowRight': tx -= PAN; applyTransform(true); e.preventDefault(); break;
        case 'ArrowUp':    ty += PAN; applyTransform(true); e.preventDefault(); break;
        case 'ArrowDown':  ty -= PAN; applyTransform(true); e.preventDefault(); break;
        case '+': case '=': zoomAt(window.innerWidth/2, window.innerHeight/2, 1.2, true); e.preventDefault(); break;
        case '-': zoomAt(window.innerWidth/2, window.innerHeight/2, 1/1.2, true); e.preventDefault(); break;
        case 'f': case 'F': fitToScreen(); break;
        case 'Escape': ttHide(); break;
    }
});

document.getElementById('z-in').addEventListener('click',  () => zoomAt(window.innerWidth/2, window.innerHeight/2, 1.3, true));
document.getElementById('z-out').addEventListener('click', () => zoomAt(window.innerWidth/2, window.innerHeight/2, 1/1.3, true));
document.getElementById('z-fit').addEventListener('click', fitToScreen);

window.addEventListener('resize', () => { if (frozenLayout) { updateRuler(); } });

// ── Tooltip ───────────────────────────────────────────────────────────────────
const ttEl = document.getElementById('tt');
function ttShow(e, d) {
    ttEl.innerHTML = `
        <div class="tt-word">${d.word}</div>
        <div class="tt-row"><span>ANO</span><span>${d.year}</span></div>
        <div class="tt-row"><span>MÍDIA DE MASSA</span><span>${d.inMedia ? 'Sim' : 'Não'}</span></div>`;
    ttMove(e); ttEl.classList.add('show');
    ttEl.setAttribute('aria-hidden', 'false');
}
function ttMove(e) {
    const pad = 14, tw = 230, th = 92;
    let x = e.clientX + pad, y = e.clientY - th / 2;
    if (x + tw > window.innerWidth)  x = e.clientX - tw - pad;
    if (y < 4)                        y = 4;
    if (y + th > window.innerHeight)  y = window.innerHeight - th - 4;
    ttEl.style.left = x + 'px'; ttEl.style.top = y + 'px';
}
function ttHide() { ttEl.classList.remove('show'); ttEl.setAttribute('aria-hidden', 'true'); }

// ── X scale ───────────────────────────────────────────────────────────────────
function buildDecadeWidths(data, dec0, decN) {
    const w = {};
    for (let d = dec0; d < decN; d += 10) {
        const n = data.filter(x => x.year >= d && x.year < d + 10).length;
        w[d] = Math.min(MAX_DEC_W, Math.max(MIN_DEC_W, Math.sqrt(n) * PX_PER_WORD * 2.2));
    }
    return w;
}
function buildXScale(dw, dec0, decN) {
    const bp = [{ year: dec0, px: 0 }];
    let cum = 0;
    for (let d = dec0; d < decN; d += 10) { cum += dw[d]; bp.push({ year: d+10, px: cum }); }
    return year => {
        for (let i = 1; i < bp.length; i++) {
            if (year <= bp[i].year) {
                const t = (year - bp[i-1].year) / 10;
                return bp[i-1].px + t * (bp[i].px - bp[i-1].px);
            }
        }
        return bp[bp.length-1].px;
    };
}

// ── Simulation — runs ONCE per data change ────────────────────────────────────
function runSimulation(data) {
    const [minY, maxY] = d3.extent(data, d => d.year);
    const dec0 = Math.floor(minY / 10) * 10;
    const decN  = Math.ceil(maxY / 10) * 10;

    const dw     = buildDecadeWidths(data, dec0, decN);
    const xScale = buildXScale(dw, dec0, decN);
    const innerW = Object.values(dw).reduce((a, b) => a + b, 0);

    // Fresh copies so we don't mutate allData
    const nodes = data.map(d => ({ ...d }));

    nodes.forEach(n => {
        n.x = xScale(n.year);
        n.y = (Math.random() - 0.5) * 40;
    });

    const sim = d3.forceSimulation(nodes)
        .force('x', d3.forceX(n => xScale(n.year)).strength(0.95))
        .force('y', d3.forceY(0).strength(0.04))
        .force('collide', d3.forceCollide(n => wordRadius(n.word) + 2.5).strength(1.0))
        .stop();

    for (let i = 0; i < 600; i++) sim.tick();

    const xMin = d3.min(nodes, n => n.x) - d3.max(nodes, n => wordRadius(n.word));
    const xMax = d3.max(nodes, n => n.x) + d3.max(nodes, n => wordRadius(n.word));
    const yMin = d3.min(nodes, n => n.y) - d3.max(nodes, n => wordRadius(n.word));
    const yMax = d3.max(nodes, n => n.y) + d3.max(nodes, n => wordRadius(n.word));

    const offX = PAD_X - xMin;
    const offY = PAD_Y - yMin;

    nodes.forEach(n => { n.x += offX; n.y += offY; });

    const svgW = (xMax - xMin) + PAD_X * 2;
    const svgH = (yMax - yMin) + PAD_Y * 2;

    // Shift xScale to account for offset
    const xScaleOffset = y => xScale(y) + offX;

    frozenNodes  = nodes;
    frozenLayout = { svgW, svgH, offX, offY, xScale: xScaleOffset, dec0, decN, yMin, yMax, xMin, xMax };
}

// ── Draw — only repositions/redraws SVG content, never moves wrapper ──────────
function drawBubbles() {
    if (!frozenNodes || !frozenLayout) return;
    const { svgW, svgH, xScale, dec0, decN, yMin, yMax, xMin, xMax, offX, offY } = frozenLayout;

    const svgEl = document.getElementById('svg');
    svgEl.setAttribute('width', svgW);
    svgEl.setAttribute('height', svgH);

    const svg = d3.select(svgEl);
    svg.selectAll('*').remove();

    const g = svg.append('g');

    // Decade dashed guide lines inside SVG (subtle, decorative)
    for (let dec = dec0; dec <= decN; dec += 10) {
        const x = xScale(dec);
        const isEdge = dec === dec0 || dec === decN;
        if (!isEdge) {
            g.append('line')
                .attr('x1', x).attr('x2', x)
                .attr('y1', 0).attr('y2', svgH - PAD_Y / 2)
                .attr('stroke', '#1e1c18')
                .attr('stroke-width', 1)
                .attr('stroke-dasharray', '3 10');
        }
    }

    // Bubbles
    frozenNodes.forEach(d => {
        const visible = (d.inMedia ? show.yes : show.no) &&
                        d.year >= yearRange[0] && d.year <= yearRange[1];
        const color = d.inMedia ? COLORS.yes : COLORS.no;
        const r = wordRadius(d.word);
        const archiveUrl = `/BajubaDigitalArchive/pt/browse.html#${encodeURIComponent(d.word.toLowerCase())}`;

        const grp = g.append('g')
            .attr('transform', `translate(${d.x},${d.y})`)
            .attr('data-bubble', '1')
            .attr('role', 'link')
            .attr('tabindex', visible ? '0' : '-1')
            .attr('aria-label', `${d.word}, primeira documentação em ${d.year}, ${d.inMedia ? 'presente' : 'ausente'} na mídia de massa. Clique para abrir no arquivo.`)
            .style('cursor', visible ? 'pointer' : 'default')
            .style('opacity', !visible ? 0.04 : 1)
            .style('pointer-events', visible ? 'all' : 'none');

        grp.append('circle')
            .attr('r', r)
            .attr('fill', color).attr('fill-opacity', 0.13)
            .attr('stroke', color).attr('stroke-width', 1.3).attr('stroke-opacity', 0.9);

        grp.append('text')
            .attr('class', 'bubble-lbl')
            .attr('fill', color)
            .attr('font-size', FONT_SIZE + 'px')
            .text(d.word);

        function openArchive(e) {
            e.stopPropagation();
            ttHide();
            window.open(archiveUrl, '_blank', 'noopener');
        }

        grp.on('mouseover', e => { if (!panning) ttShow(e, d); })
           .on('mousemove', e => ttMove(e))
           .on('mouseout',  () => ttHide())
           .on('click', openArchive)
           .on('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openArchive(e); } });
    });

    svg.on('click', () => {});
}

// ── Full rebuild (simulation + draw) — only on data/filter change ─────────────
function rebuild() {
    const data = allData.filter(d =>
        ((d.inMedia && show.yes) || (!d.inMedia && show.no)) &&
        d.year >= yearRange[0] && d.year <= yearRange[1]
    );

    // Also include hidden items in simulation so layout is stable
    const allVisible = allData.filter(d => d.year >= yearRange[0] && d.year <= yearRange[1]);

    document.getElementById('stats').innerHTML =
        `<strong>${data.length}</strong> / ${allData.length} palavras`;

    if (!allVisible.length) return;

    runSimulation(allVisible); // simulate all, visibility handled in draw
    drawBubbles();
    updateRuler();
}

// ── Controls — these call rebuild(), not render() ─────────────────────────────
document.getElementById('btn-yes').addEventListener('click', function() {
    show.yes = !show.yes;
    this.setAttribute('aria-pressed', show.yes);
    this.classList.toggle('on-gold', show.yes);
    this.querySelector('.dot').style.background = show.yes ? 'var(--gold)' : 'var(--muted)';
    activeWord = null;
    // Only redraw bubbles (layout stays, just opacity changes)
    drawBubbles();
});
document.getElementById('btn-no').addEventListener('click', function() {
    show.no = !show.no;
    this.setAttribute('aria-pressed', show.no);
    this.classList.toggle('on-blue', show.no);
    this.querySelector('.dot').style.background = show.no ? 'var(--blue)' : 'var(--muted)';
    activeWord = null;
    drawBubbles();
});

const yrStart = document.getElementById('yr-start');
const yrEnd   = document.getElementById('yr-end');
const rangeLbl = document.getElementById('range-lbl');
function syncRange() {
    let s = +yrStart.value, e = +yrEnd.value;
    if (s > e) [s, e] = [e, s];
    yearRange = [s, e];
    rangeLbl.textContent = `${s} – ${e}`;
    yrStart.setAttribute('aria-valuetext', `ano inicial ${s}`);
    yrEnd.setAttribute('aria-valuetext', `ano final ${e}`);
    // Year range changes layout — need full rebuild
    rebuild();
    fitToScreen();
}
yrStart.addEventListener('input', syncRange);
yrEnd.addEventListener('input', syncRange);

// ── Load ──────────────────────────────────────────────────────────────────────
d3.csv(CSV_URL).then(raw => {
    allData = raw.map(row => {
        const d = {};
        for (const k of Object.keys(row)) d[k.trim()] = (row[k] || '').trim();
        return {
            word:    d['standardized_words'] || '',
            year:    +d['year_first_documentation'],
            inMedia: (d['appears_in_mass_media'] || '').toLowerCase() === 'yes',
        };
    }).filter(d => d.word && Number.isFinite(d.year) && d.year > 0);

    if (!allData.length) {
        document.getElementById('loading').textContent = 'Nenhum dado encontrado. Verifique o console.';
        return;
    }

    const [minY, maxY] = d3.extent(allData, d => d.year);
    yrStart.min = minY; yrStart.max = maxY; yrStart.value = minY;
    yrEnd.min   = minY; yrEnd.max   = maxY; yrEnd.value   = maxY;
    yearRange = [minY, maxY];
    rangeLbl.textContent = `${minY} – ${maxY}`;

    document.getElementById('loading').style.display = 'none';

    rebuild();
    setTimeout(fitToScreen, 50);

}).catch(err => {
    document.getElementById('loading').textContent = `Erro ao carregar dados: ${err.message}`;
});
</script>
</body>
